plugins {
    id 'java'
}

allprojects {
    group = 'ru.mcs'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        modularity.inferModulePath = true
    }

    test {
        useJUnitPlatform()
    }


}
