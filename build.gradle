plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'ru.mcs'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.base']
}

dependencies {
    // HTTP client (JDK built-in HttpClient - no external dep needed)
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.7'
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // SQLite
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // JavaParser для AST
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.26.3'
}

application {
    mainModule = 'ru.mcs.llmrobot'
    mainClass = 'ru.mcs.llmrobot.app.javafx.LlmRobotApp'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'ru.mcs.llmrobot.app.javafx.LlmRobotApp'
    }
}
