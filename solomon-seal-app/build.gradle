plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation project(':solomon-seal-spi')
    implementation project(':solomon-seal-core')
    implementation project(':solomon-seal-ui')
    implementation project(':solomon-seal-ui-spi')
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'
    implementation 'com.github.javaparser:javaparser-core:3.25.8'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.web']
}

application {
    mainModule = 'ru.mcs.solomonseal.app'
    mainClass = 'ru.mcs.solomonseal.app.Main'
}